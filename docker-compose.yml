services:

  redis:
    image: redis:7-alpine
    container_name: ai-assistant-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: ai-assistant-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_BASE_URL: http://127.0.0.1:8000
    depends_on: [redis]
    ports:
      - "8000:8000"

  bot:
    build: .
    container_name: ai-assistant-bot
    command: python -m app.run_bot
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_BASE_URL: http://api:8000          
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis, api]

  celery-worker:
    build: .
    container_name: ai-assistant-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_BASE_URL: http://api:8000
    depends_on: [redis, api]